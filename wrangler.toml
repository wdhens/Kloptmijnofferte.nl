name = "klopmijnofferte-api"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
DAILY_CAP_USD = "2"
CONSENT_VERSION = "2026-11-05"
ALLOWED_ORIGIN = "https://klopmijnofferte.nl"
AUTO_SHIP_VARIANTS = "true"

[[d1_databases]]
binding = "DB"
database_name = "klopmijnofferte"
database_id = "REPLACE_AFTER_wrangler_d1_create"
migrations_dir = "migrations"

# Secrets (wrangler secret put): ANTHROPIC_API_KEY, INSTALLER_HMAC_KEY, REPORT_TOKEN, optional REPORT_WEBHOOK_URL (e.g. a Make webhook)

[triggers]
crons = ["0 6 15 * *", "0 7 * * 1"]   # monthly CBS tariffs; weekly learning report (Mondays)
